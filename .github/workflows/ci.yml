name: CI

# Runs on pushes to main/develop and on pull requests targeting them.
# Any other branch (with no pull request into main/develop) runs nothing.
# Also called by cd.yml, so main is tested before an image is published.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  docker-build:
    # Catches a broken Dockerfile before it reaches main. Builds only, never pushes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
