name: CD

# Runs only on commits to main: test, publish the image to GHCR, then deploy to the home server.
on:
  push:
    branches: [main]

# Never cancel a publish half-way; queue the next one instead.
concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # CD is the only cache writer (runs are serialized by the concurrency group above).
          cache-from: type=gha,scope=rupee-tracker
          cache-to: type=gha,mode=max,scope=rupee-tracker

  deploy:
    name: Deploy to homeserver
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --accept-routes

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to server
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          # Heredoc is unquoted on purpose: $GHCR_PAT must expand here on the runner.
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            deployer@${{ secrets.TAILSCALE_SERVER_IP }} << ENDSSH
            set -e
            cd /opt/telegram-bot

            echo "Logging into GHCR..."
            echo "$GHCR_PAT" | docker login ghcr.io -u jasjeev013 --password-stdin

            echo "Pulling latest image..."
            docker compose pull

            echo "Restarting containers..."
            docker compose up -d --remove-orphans

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deployment complete!"
            docker compose ps
          ENDSSH
